name: tag-releases

# Tag each plugin version as it lands on main, as `<plugin>--v<version>` at the commit that set it.
# Claude Code resolves a dependency's version constraint against these tags, so a version with no tag
# leaves every plugin that needs it turned off. See .github/scripts/missing_tags.py.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main' # a manual run on another branch would tag that branch's commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history and its tags, to find where each version landed
          persist-credentials: false
      - name: Tag versions that have no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Into a file first, so a failing script fails the step instead of tagging nothing.
          python3 .github/scripts/missing_tags.py > missing.txt
          failed=0
          while read -r tag sha; do
            echo "tagging $tag at $sha"
            # An annotated tag, like the ones made by hand before this workflow.
            if object=$(gh api "repos/$REPO/git/tags" -f "tag=$tag" -f "message=${tag/--v/ }" \
                -f "object=$sha" -f type=commit --jq .sha) &&
              gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$object" --silent; then
              continue
            fi
            echo "::error::could not create $tag"
            failed=1
          done < missing.txt
          exit "$failed"
