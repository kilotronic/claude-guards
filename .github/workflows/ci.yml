name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The guards' tests, on the oldest and newest Python the hooks support.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uvx --python ${{ matrix.python }} pytest -q tests

  # The plugin and marketplace manifests as Claude Code reads them.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @anthropic-ai/claude-code@2.1.323 plugin validate .

  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}
          if-empty: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') && 'skip' || 'fail' }}

  # Secrets in this event's commits, from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # v1.2.1

  # Real authors on this event's commits, and no session trailer in a public repository.
  git-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allow-bots on a push asks which pull request a commit merged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/git-identity@b0d54e809d81cabf61d357cbe519a9b9263b17cb # v2.4.0
        with:
          domains: ixid.net, kilotronic.com
          allow-bots: dependabot, renovate
          commit-subject: true

  # The shared format and lint checks over every file.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/lint@56a43d45e7b4479bba97c79404a4dc7671bd9796 # v1.3.2
